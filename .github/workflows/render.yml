name: Render daily calendar

on:
  schedule:
    # 16:05 UTC is 00:05 Singapore time
    - cron: "5 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generator/**]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r generator/requirements.txt
      - run: python generator/generate.py
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
      - name: Commit rendered output
        run: |
          git config user.name "tylendar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/tylendar.bin output/preview.png
          git diff --cached --quiet || git commit -m "render: daily image"
          git push
